name: Build Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      server_url:
        description: "Production Game Server URL"
        required: false
        default: "https://bingo-royale.onrender.com"

jobs:
  build-android:
    name: Build Android Testing APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK not found at $ANDROID_SDK_ROOT"
            exit 1
          fi

          echo "Android SDK found:"
          ls -la "$ANDROID_SDK_ROOT"

          echo ""
          echo "Available Android SDK platforms:"
          ls -la "$ANDROID_SDK_ROOT/platforms" || true

          echo ""
          echo "Available Android Build Tools:"
          ls -la "$ANDROID_SDK_ROOT/build-tools" || true

      - name: Setup Android SDK Platform 36 & Licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          mkdir -p "$ANDROID_HOME/licenses" || true
          yes | sdkmanager --licenses || true
          yes | sdkmanager "platforms;android-36" || true

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Tests & Type Checks
        run: |
          npm run lint
          npm test

      - name: Build Web Application
        env:
          VITE_SERVER_URL: ${{ github.event.inputs.server_url || 'https://bingo-royale.onrender.com' }}
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          if [ ! -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "APK was not generated!"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bingo-royale-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
